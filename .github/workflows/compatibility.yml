name: Compatibility Tests

on:
  push:
    branches: [unstable]
  pull_request:
    paths:
      - 'src/storage/**'
      - 'src/types/**'
      - 'src/commands/**'
      - 'src/config/**'
      - 'tests/gocase/**'
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: true

jobs:
  compatibility-test:
    runs-on: ubuntu-22.04
    env:
      # Test old-version data against the PR's own build, not the released
      # :latest image, so an encoding regression in the change under test
      # is caught.
      KVROCKS_NEW_VERSION: current
    steps:
      - uses: actions/checkout@v6

      # The old-version images are pulled from Docker Hub by the test; only
      # the "new" side is built here, once, and reused for every version.
      # Uses the same buildx method as the nightly image build; push defaults
      # to false, so the image stays local.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Build current kvrocks image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: apache/kvrocks:current

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'tests/gocase/go.mod'
          cache: false

      - name: Run compatibility test for all old versions
        run: |
          set -e
          cd tests/gocase
          for v in v2.3.0 v2.6.0 v2.7.0 v2.10.0 v2.14.0 v2.15.0; do
            echo "=== $v -> current ==="
            # -count=1 is required: the go test result cache keys on the
            # binary and -run flags but not on KVROCKS_OLD_VERSION, so
            # without it every version after the first replays the first
            # version's cached pass.
            KVROCKS_OLD_VERSION="$v" go test -count=1 -run TestCompatibilityAllTypes ./integration/compatibility/
          done
